name: Publish QTP Linux x64 Binary (qtp.bin)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qtp/**'
      - '!qtp/qtp.bin'
      - '.github/workflows/qtp-publish-linux.yml'

permissions:
  contents: write

jobs:
  build-and-publish-linux-bin:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install headless Qt shared libraries on Ubuntu
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 \
            libfontconfig1 libfreetype6 xvfb binutils

      - name: Setup Python 3.12 and dependencies
        working-directory: qtp/standalone
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: Run legacy unit test suite
        working-directory: qtp
        run: |
          standalone/.venv/bin/python -m unittest discover -s legacy/tests -v

      - name: Run full standalone test & coverage gate before build
        working-directory: qtp/standalone
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a .venv/bin/python -m pytest -q --cov=qtp_app.core --cov=qtp_app.ui.search --cov=qtp_app.tui --cov=qtp_app.web --cov=qtp_app.cli --cov-report=term-missing --cov-fail-under=90

      - name: Build native Linux x64 ELF binary
        working-directory: qtp/standalone
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python -m qtp_app.build.build_unix

      - name: Verify ELF header, size and clean-dir stripped-PATH execution
        run: |
          command -v file >/dev/null && file qtp/standalone/dist/qtp.bin || readelf -h qtp/standalone/dist/qtp.bin | head -n 20
          python3 -c '
          from pathlib import Path
          p = Path("qtp/standalone/dist/qtp.bin")
          raw = p.read_bytes()
          assert raw[:4] == b"\x7fELF", f"Not ELF: {raw[:4]!r}"
          assert len(raw) <= 60 * 1024 * 1024, f"Too large: {len(raw)}"
          print("ELF verified, bytes:", len(raw))
          '
          mkdir -p /tmp/qtp_clean
          cp qtp/standalone/dist/qtp.bin /tmp/qtp_clean/qtp.bin
          chmod +x /tmp/qtp_clean/qtp.bin
          (
            cd /tmp/qtp_clean
            export PATH="/usr/bin:/bin" HOME="/tmp/qtp_clean_home" LANG="C" LC_ALL="C" QT_QPA_PLATFORM="offscreen"
            mkdir -p "$HOME"
            ./qtp.bin --selftest
            ./qtp.bin --version
            ./qtp.bin --verbose --help >/dev/null
            ./qtp.bin --completion bash >/dev/null
            ./qtp.bin --list-categories --json >/dev/null
            ./qtp.bin --search "şifre" --json >/dev/null
            printf "V\033M\033q" | ./qtp.bin --tui >/dev/null
            ./qtp.bin --web --port 0 --shutdown-after 0.5
          )
          cp qtp/standalone/dist/qtp.bin qtp/qtp.bin
          chmod +x qtp/qtp.bin
          rm -rf qtp/standalone/dist qtp/standalone/build qtp/standalone/.venv qtp/standalone/.coverage qtp/standalone/.pytest_cache || true

      - name: Commit and push qtp/qtp.bin to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x qtp/qtp.bin || true
          git add qtp/qtp.bin
          if ! git diff --cached --quiet; then
            git commit -m "chore(qtp/dist): publish Linux x64 portable binary qtp.bin [skip ci]"
            for i in 1 2 3; do
              if git push origin main; then
                exit 0
              fi
              git pull --rebase origin main
            done
            exit 1
          fi
