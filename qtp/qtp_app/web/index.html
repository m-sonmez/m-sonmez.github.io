<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QTP — Hazır Cevaplar (Web Modu)</title>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <main class="overlay-card" role="application" aria-label="QTP Hızlı Yapıştırma Katmanı">
    <div class="top-row">
      <input id="searchInput" class="search-input" type="text" placeholder="Ara… (mesaj, kategori, etiket)" autofocus />
      <button class="action-btn" id="btnHotkeys" title="Global Kısayollar ve Çakışma Denetimi">Kısayollar</button>
      <button class="action-btn" id="btnReload" title="INI Yeniden Yükle">Yenile</button>
      <button class="action-btn" id="btnBackup" title="Anlık Yedek Al">Yedekle</button>
      <button class="action-btn" id="btnHelp" title="Türkçe Yardım (F1)">Yardım (F1)</button>
    </div>

    <div class="pills-row" id="categoryPills"></div>
    <section class="snippet-list" id="snippetList" tabindex="0"></section>

    <footer class="footer-bar">
      <span>↑↓ Gezin · ⏎ Yapıştır · Ctrl+⏎ Kopyala · Esc Kapat</span>
      <span id="itemCount">0 kayıt</span>
    </footer>
  </main>

  <div class="toast" id="toastBox"></div>

  <div class="modal" id="modalBackdrop">
    <div class="modal-card">
      <div class="top-row" style="justify-content:space-between;margin-bottom:8px;">
        <strong id="modalTitle">Bilgi</strong>
        <button class="action-btn" id="modalClose">Kapat (Esc)</button>
      </div>
      <div id="helpTabs" class="pills-row" style="display:none;margin-bottom:10px;">
        <button class="pill active" data-section="all">Tümü</button>
        <button class="pill" data-section="usage_verbose">CLI &amp; Parametreler</button>
        <button class="pill" data-section="kullanim">Kullanım</button>
        <button class="pill" data-section="kisayollar">Kısayollar</button>
        <button class="pill" data-section="sss">SSS</button>
      </div>
      <div id="hotkeyControls" style="display:none;margin-bottom:10px;gap:6px;flex-wrap:wrap;align-items:center;">
        <select id="presetSelect" class="action-btn">
          <option value="recommended">Önerilen (Win+Alt)</option>
          <option value="win_ctrl">Win+Ctrl</option>
          <option value="ctrl_alt">Ctrl+Alt</option>
          <option value="ctrl_shift_alt">Ctrl+Alt+Shift</option>
          <option value="function_keys">Ctrl+Shift+F1–F5</option>
          <option value="legacy_win">Klasik (Win)</option>
        </select>
        <button class="action-btn" id="btnApplyPreset">Profil Uygula</button>
        <select id="modSelect" class="action-btn">
          <option value="Win+Alt">Win+Alt</option>
          <option value="Win+Ctrl">Win+Ctrl</option>
          <option value="Ctrl+Alt">Ctrl+Alt</option>
          <option value="Ctrl+Alt+Shift">Ctrl+Alt+Shift</option>
          <option value="Ctrl+Shift">Ctrl+Shift</option>
          <option value="Ctrl">Ctrl</option>
          <option value="Win">Win</option>
        </select>
        <button class="action-btn" id="btnApplyMods">Değiştirici Uygula</button>
      </div>
      <pre id="modalBody"></pre>
    </div>
  </div>

  <script>
    const state = { category: 'ALL', query: '', items: [], categories: [], selected: 0, revision: 0, helpData: null, helpSection: 'all' };
    const els = {
      search: document.getElementById('searchInput'),
      pills: document.getElementById('categoryPills'),
      list: document.getElementById('snippetList'),
      count: document.getElementById('itemCount'),
      toast: document.getElementById('toastBox'),
      modal: document.getElementById('modalBackdrop'),
      modalTitle: document.getElementById('modalTitle'),
      modalBody: document.getElementById('modalBody'),
      hotkeyControls: document.getElementById('hotkeyControls'),
      helpTabs: document.getElementById('helpTabs'),
    };

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.style.display = 'block';
      setTimeout(() => { els.toast.style.display = 'none'; }, 1500);
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: {} };
      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const resp = await fetch(path, opts);
      return await resp.json();
    }

    async function loadCategories() {
      const res = await api('/api/categories');
      if (res.ok) {
        state.categories = res.data.categories;
        renderPills();
      }
    }

    async function loadItems() {
      const q = encodeURIComponent(state.query);
      const c = encodeURIComponent(state.category);
      const res = await api(`/api/items?category=${c}&query=${q}`);
      if (res.ok) {
        state.items = res.data.items;
        state.selected = 0;
        renderList();
      }
    }

    async function showHotkeysModal() {
      const r = await api('/api/hotkeys/check');
      els.modalTitle.textContent = 'Global Kısayollar ve Çakışma Denetimi';
      els.helpTabs.style.display = 'none';
      els.hotkeyControls.style.display = 'flex';
      const lines = Object.entries(r.data.hotkeys).map(([k, v]) => `${k}: ${v}`);
      const ckeys = Object.keys(r.data.conflicts || {});
      if (ckeys.length) {
        lines.push('', 'Uyarılar:');
        for (const ck of ckeys) {
          lines.push(`! ${ck}: ${r.data.conflicts[ck].join('; ')}`);
        }
      } else {
        lines.push('', 'Çakışma algılanmadı ✔');
      }
      els.modalBody.textContent = lines.join('\n');
      els.modal.style.display = 'flex';
    }

    function renderHelpSection(sectionKey) {
      if (!state.helpData) return;
      state.helpSection = sectionKey;
      for (const btn of els.helpTabs.querySelectorAll('[data-section]')) {
        btn.classList.toggle('active', btn.dataset.section === sectionKey);
      }
      if (sectionKey === 'all') {
        const sep = '\n\n' + '='.repeat(60) + '\n\n';
        els.modalBody.textContent = [
          '=== CLI & Parametreler ===\n\n' + (state.helpData.usage_verbose || state.helpData.usage || ''),
          '=== Kullanım ===\n\n' + (state.helpData.kullanim || ''),
          '=== Kısayollar ===\n\n' + (state.helpData.kisayollar || ''),
          '=== Sorun Giderme (SSS) ===\n\n' + (state.helpData.sss || ''),
        ].join(sep);
      } else {
        els.modalBody.textContent = state.helpData[sectionKey] || '';
      }
    }

    async function showHelpModal(sectionKey = 'all') {
      if (!state.helpData) {
        const r = await api('/api/help?verbose=1');
        if (r.ok && r.data) {
          state.helpData = r.data;
        }
      }
      els.hotkeyControls.style.display = 'none';
      els.helpTabs.style.display = 'flex';
      els.modalTitle.textContent = 'QTP Türkçe Yardım (F1)';
      renderHelpSection(sectionKey);
      els.modal.style.display = 'flex';
    }

    function renderPills() {
      els.pills.innerHTML = '';
      for (const cat of state.categories) {
        const b = document.createElement('button');
        b.className = 'pill' + (cat.code === state.category ? ' active' : '');
        b.textContent = `${cat.label} (${cat.count})`;
        b.onclick = () => { state.category = cat.code; renderPills(); loadItems(); };
        els.pills.appendChild(b);
      }
    }

    function renderList() {
      els.list.innerHTML = '';
      const visible = state.items.slice(0, 200);
      els.count.textContent = `${state.items.length} kayıt`;
      visible.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'snippet-row' + (idx === state.selected ? ' selected' : '');
        const left = document.createElement('div');
        const txt = document.createElement('div');
        txt.className = 'snippet-text';
        txt.textContent = it.text.slice(0, 140);
        const meta = document.createElement('div');
        meta.className = 'snippet-meta';
        meta.textContent = it.label ? `${it.group} · ${it.label}` : it.group;
        left.appendChild(txt);
        left.appendChild(meta);

        const right = document.createElement('div');
        right.style.display = 'flex';
        right.style.gap = '6px';
        right.style.alignItems = 'center';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.textContent = 'Kopyala';
        copyBtn.onclick = async (ev) => {
          ev.stopPropagation();
          const r = await api('/api/copy', 'POST', { target: it.raw_key });
          showToast(r.message || r.error);
        };
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = (it.keys || '').split('+').pop() || '•';
        right.appendChild(copyBtn);
        right.appendChild(badge);

        row.appendChild(left);
        row.appendChild(right);
        row.onclick = async () => {
          state.selected = idx;
          renderList();
          const r = await api('/api/paste', 'POST', { target: it.raw_key });
          showToast(r.message || r.error);
        };
        els.list.appendChild(row);
      });
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      loadItems();
    });

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'F1') {
        e.preventDefault();
        await showHelpModal('all');
      } else if (e.key === 'Escape') {
        if (els.modal.style.display === 'flex') {
          els.modal.style.display = 'none';
        } else {
          els.search.value = '';
          state.query = '';
          loadItems();
        }
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        els.search.focus();
      } else if (e.key === '/') {
        if (document.activeElement !== els.search) {
          e.preventDefault();
          els.search.focus();
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.selected = Math.min(Math.max(0, state.items.length - 1), state.selected + 1);
        renderList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.selected = Math.max(0, state.selected - 1);
        renderList();
      } else if (e.key === 'Enter' && state.items[state.selected]) {
        e.preventDefault();
        const it = state.items[state.selected];
        const route = (e.ctrlKey || e.metaKey) ? '/api/copy' : '/api/paste';
        const r = await api(route, 'POST', { target: it.raw_key });
        showToast(r.message || r.error);
      }
    });

    document.getElementById('modalClose').onclick = () => { els.modal.style.display = 'none'; };
    document.getElementById('btnHelp').onclick = () => showHelpModal('all');
    for (const btn of els.helpTabs.querySelectorAll('[data-section]')) {
      btn.onclick = () => renderHelpSection(btn.dataset.section);
    }
    document.getElementById('btnHotkeys').onclick = showHotkeysModal;
    document.getElementById('btnApplyPreset').onclick = async () => {
      const preset = document.getElementById('presetSelect').value;
      const r = await api('/api/hotkeys/preset', 'POST', { preset });
      showToast(r.message || r.error);
      showHotkeysModal();
    };
    document.getElementById('btnApplyMods').onclick = async () => {
      const modifiers = document.getElementById('modSelect').value;
      const r = await api('/api/hotkeys/modifiers', 'POST', { modifiers });
      showToast(r.message || r.error);
      showHotkeysModal();
    };
    document.getElementById('btnReload').onclick = async () => {
      const r = await api('/api/reload', 'POST', {});
      showToast(r.message || r.error);
      loadCategories();
      loadItems();
    };
    document.getElementById('btnBackup').onclick = async () => {
      const r = await api('/api/backup', 'POST', {});
      showToast(r.message || r.error);
    };

    setInterval(async () => {
      try {
        const r = await api('/api/revision');
        if (r.ok && r.data.revision !== state.revision) {
          const prevRev = state.revision;
          state.revision = r.data.revision;
          if (prevRev !== 0) {
            await loadCategories();
            await loadItems();
            showToast('Değişiklikler otomatik yenilendi ✔');
          }
        }
      } catch (_err) {
      }
    }, 1000);

    async function initWebUi() {
      try {
        const r = await api('/api/revision');
        if (r.ok && r.data) {
          state.revision = r.data.revision || 0;
          if (r.data.initial_category) {
            state.category = String(r.data.initial_category).toUpperCase();
          }
          if (r.data.initial_query) {
            state.query = String(r.data.initial_query);
            els.search.value = state.query;
          }
        }
      } catch (_err) {
      }
      await loadCategories();
      await loadItems();
    }

    initWebUi();
  </script>
</body>
</html>
