    function trLower(text) {
      if (!text) return '';
      return String(text)
        .replace(/\u0130/g, 'i')
        .replace(/I/g, '\u0131')
        .replace(/\u015e/g, '\u015f')
        .replace(/\u011e/g, '\u011f')
        .replace(/\u00dc/g, '\u00fc')
        .replace(/\u00d6/g, '\u00f6')
        .replace(/\u00c7/g, '\u00e7')
        .replace(/\u0307/g, '')
        .toLowerCase();
    }

    function isWordChar(ch) {
      return Boolean(ch && /[\p{L}\p{N}]/u.test(ch));
    }

    function hotkeyBadge(keys) {
      const raw = String(keys || '').trim();
      if (raw.includes('+')) {
        return raw.slice(raw.lastIndexOf('+') + 1).trim().toUpperCase();
      }
      return raw.toUpperCase();
    }

    function itemMatchesCategory(item, categoryCode) {
      const code = String(categoryCode || 'ALL').trim().toUpperCase();
      if (!code || code === 'ALL') return true;
      const keys = String(item.keys || item.hotkey_prefix || '').trim().toUpperCase();
      return keys.endsWith('+' + code) || keys === code;
    }

    function matchText(query, target) {
      const qClean = trLower(String(query || '').trim());
      if (!qClean) return { score: 0, matchedIndices: [] };
      const tNorm = trLower(String(target || ''));
      if (!tNorm) return null;

      const exactPos = tNorm.indexOf(qClean);
      if (exactPos !== -1) {
        const indices = [];
        for (let i = exactPos; i < exactPos + qClean.length; i++) {
          indices.push(i);
        }
        const boundaryBonus = (exactPos === 0 || !isWordChar(tNorm[exactPos - 1])) ? 40.0 : 15.0;
        const score = 200.0 + boundaryBonus - (exactPos * 0.15) - (tNorm.length * 0.01);
        return { score, matchedIndices: indices };
      }

      const qChars = Array.from(qClean).filter((ch) => !/\s/.test(ch));
      if (!qChars.length) return { score: 0, matchedIndices: [] };

      const matched = [];
      let tIdx = 0;
      const n = tNorm.length;
      for (const qch of qChars) {
        let found = -1;
        while (tIdx < n) {
          if (tNorm[tIdx] === qch) {
            found = tIdx;
            tIdx += 1;
            break;
          }
          tIdx += 1;
        }
        if (found === -1) return null;
        matched.push(found);
      }

      let score = 80.0;
      for (let posI = 0; posI < matched.length; posI++) {
        const idx = matched[posI];
        if (idx === 0 || !isWordChar(tNorm[idx - 1])) score += 12.0;
        if (posI > 0) {
          const gap = idx - matched[posI - 1] - 1;
          score += gap === 0 ? 18.0 : -Math.min(gap * 1.2, 10.0);
        }
      }
      const span = matched[matched.length - 1] - matched[0] + 1;
      score -= (span - matched.length) * 0.4;
      score -= matched[0] * 0.1;
      return { score, matchedIndices: matched };
    }

    function scoreItem(query, item) {
      const qClean = trLower(String(query || '').trim());
      if (!qClean) return { score: 0, matchedIndices: [] };

      const textMatch = matchText(query, item.text || '');
      const labelMatch = item.label ? matchText(query, item.label) : null;
      const groupMatch = item.group ? matchText(query, item.group) : null;
      const badge = hotkeyBadge(item.keys || '');
      const badgeMatch = badge ? matchText(query, badge) : null;

      const candidates = [];
      if (textMatch) candidates.push(textMatch.score + 10.0);
      if (labelMatch) candidates.push(labelMatch.score + 25.0);
      if (groupMatch) candidates.push(groupMatch.score + 5.0);
      if (badgeMatch) candidates.push(badgeMatch.score);
      if (!candidates.length) return null;

      return {
        score: Math.max(...candidates),
        matchedIndices: textMatch ? textMatch.matchedIndices : [],
      };
    }

    function filterItemsStatic(query, items) {
      const qStripped = String(query || '').trim();
      if (!qStripped) {
        return items.map((it) => ({ ...it, matched_indices: [] }));
      }
      const scored = [];
      for (let idx = 0; idx < items.length; idx++) {
        const res = scoreItem(qStripped, items[idx]);
        if (res) {
          scored.push({ score: res.score, idx, item: items[idx], indices: res.matchedIndices });
        }
      }
      scored.sort((a, b) => (b.score !== a.score ? b.score - a.score : a.idx - b.idx));
      return scored.map((row) => ({ ...row.item, matched_indices: row.indices }));
    }

    function decodeBytesAuto(uint8) {
      if (uint8.length >= 2 && uint8[0] === 0xFF && uint8[1] === 0xFE) {
        return { text: new TextDecoder('utf-16le').decode(uint8.subarray(2)), encoding: 'utf-16-le-bom' };
      }
      if (uint8.length >= 2 && uint8[0] === 0xFE && uint8[1] === 0xFF) {
        return { text: new TextDecoder('utf-16be').decode(uint8.subarray(2)), encoding: 'utf-16-be-bom' };
      }
      if (uint8.length >= 3 && uint8[0] === 0xEF && uint8[1] === 0xBB && uint8[2] === 0xBF) {
        return { text: new TextDecoder('utf-8').decode(uint8.subarray(3)), encoding: 'utf-8-bom' };
      }
      try {
        return { text: new TextDecoder('utf-8', { fatal: true }).decode(uint8), encoding: 'utf-8' };
      } catch (_err) {
        try {
          return { text: new TextDecoder('windows-1254').decode(uint8), encoding: 'windows-1254' };
        } catch (_err2) {
          return { text: new TextDecoder('utf-8').decode(uint8), encoding: 'utf-8' };
        }
      }
    }

    function parseQtpIni(content) {
      let sectionLower = null;
      let sectionOrig = null;
      const texts = {};
      const orders = {};
      const labels = {};
      const program = {};
      const extraMap = new Map();
      let seq = 0;

      for (const rawLine of String(content || '').replace(/^\ufeff/, '').split(/\r?\n/)) {
        const stripped = rawLine.trim();
        if (!stripped) continue;
        if (stripped.startsWith('[') && stripped.endsWith(']')) {
          sectionOrig = stripped.slice(1, -1).trim();
          sectionLower = sectionOrig.toLowerCase();
          if (!['program', 'list_text', 'list_order', 'list_label'].includes(sectionLower)) {
            if (!extraMap.has(sectionOrig)) extraMap.set(sectionOrig, []);
          }
          continue;
        }
        if (sectionOrig && !['program', 'list_text', 'list_order', 'list_label'].includes(sectionLower)) {
          extraMap.get(sectionOrig).push(rawLine);
          continue;
        }
        if (stripped.startsWith(';') || stripped.startsWith('#')) continue;
        const firstEq = rawLine.indexOf('=');
        if (firstEq === -1) continue;
        if (sectionLower === 'program') {
          const k = rawLine.slice(0, firstEq).trim();
          if (k) program[k] = rawLine.slice(firstEq + 1).trim();
        } else if (sectionLower === 'list_text') {
          const tid = rawLine.slice(0, firstEq).trim();
          const rest = rawLine.slice(firstEq + 1);
          const secondEq = rest.indexOf('=');
          if (secondEq === -1) continue;
          const keys = rest.slice(0, secondEq).trim();
          let val = rest.slice(secondEq + 1);
          let term = '';
          const trimmedEnd = val.trimEnd();
          if (trimmedEnd.endsWith(DEFAULT_TERMINATOR)) {
            term = DEFAULT_TERMINATOR;
            let clean = trimmedEnd;
            while (clean.endsWith(DEFAULT_TERMINATOR)) {
              clean = clean.slice(0, -DEFAULT_TERMINATOR.length);
            }
            val = clean;
          }
          val = val.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
          texts[tid] = { keys, text: val, terminator: term, seq: seq++ };
        } else if (sectionLower === 'list_order') {
          const v = parseInt(rawLine.slice(firstEq + 1).trim(), 10);
          if (Number.isFinite(v)) orders[rawLine.slice(0, firstEq).trim()] = v;
        } else if (sectionLower === 'list_label') {
          labels[rawLine.slice(0, firstEq).trim()] = rawLine.slice(firstEq + 1).trim();
        }
      }

      const sortedIds = Object.keys(texts).sort((a, b) => {
        const oa = orders[a] ?? 1e9;
        const ob = orders[b] ?? 1e9;
        if (oa !== ob) return oa - ob;
        return texts[a].seq - texts[b].seq;
      });

      const items = sortedIds.map((tid) => {
        const rawLbl = labels[tid] || '';
        const slash = rawLbl.lastIndexOf('/');
        const group = slash !== -1 ? (rawLbl.slice(0, slash).trim() || 'Genel') : 'Genel';
        const label = slash !== -1 ? rawLbl.slice(slash + 1).trim() : rawLbl.trim();
        return {
          raw_key: tid,
          keys: texts[tid].keys,
          group,
          label,
          text: texts[tid].text,
          terminator: texts[tid].terminator,
        };
      });

      const extraSections = [];
      extraMap.forEach((lines, name) => {
        if (lines.length) extraSections.push({ name, lines });
      });
      return { items, program, extraSections };
    }

    function buildQtpIni(items, program = {}, extraSections = []) {
      const progOut = {
        TestIni: String(Math.floor(Date.now() / 1000)),
        m_show_tree: '1',
        listcmd_count: String(items.length),
        WinRC: '2399;17;3368;1335;1;x,y,w,h,SW',
        lng: '21',
        start_tray: '1',
        ...program,
      };
      progOut.listcmd_count = String(items.length);
      const lines = ['[Program]'];
      for (const [k, v] of Object.entries(progOut)) {
        lines.push(`${k}=${v}`);
      }
      lines.push('[list_text]');
      items.forEach((it, i) => {
        const tid = it.raw_key || `text_${String(i).padStart(3, '0')}`;
        const txt = String(it.text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n/g, '\\n');
        const term = it.terminator !== undefined ? it.terminator : DEFAULT_TERMINATOR;
        lines.push(`${tid}=${String(it.keys || '').trim()}=${txt}${term}`);
      });
      lines.push('[list_order]');
      items.forEach((it, i) => {
        const tid = it.raw_key || `text_${String(i).padStart(3, '0')}`;
        lines.push(`${tid}=${i + 1}`);
      });
      lines.push('[list_label]');
      items.forEach((it, i) => {
        const tid = it.raw_key || `text_${String(i).padStart(3, '0')}`;
        const grp = String(it.group || '').trim();
        let lbl = String(it.label || '').replace(/\//g, '-').replace(/[\r\n]+/g, ' ').trim();
        if (!lbl) {
          const prev = String(it.text || '').replace(/\n/g, ' ').trim();
          lbl = prev.slice(0, 45) + (prev.length > 45 ? '...' : '');
        }
        lines.push(`${tid}=${grp && grp !== 'Genel' ? `${grp}/${lbl}` : lbl}`);
      });
      if (Array.isArray(extraSections)) {
        for (const sec of extraSections) {
          if (sec && sec.name && Array.isArray(sec.lines) && sec.lines.length) {
            lines.push(`[${sec.name}]`);
            sec.lines.forEach((l) => lines.push(String(l)));
          }
        }
      }
      return lines.join('\r\n') + '\r\n';
    }

    function encodeUtf16LeBom(str) {
      const buf = new ArrayBuffer(2 + str.length * 2);
      const view = new DataView(buf);
      view.setUint8(0, 0xFF);
      view.setUint8(1, 0xFE);
      for (let i = 0; i < str.length; i++) {
        view.setUint16(2 + i * 2, str.charCodeAt(i), true);
      }
      return new Uint8Array(buf);
    }

    function formatIniPreview(item, index) {
      const tid = String(item.raw_key || `text_${String(index).padStart(3, '0')}`);
      const keys = String(item.keys || '');
      const term = item.terminator !== undefined ? item.terminator : DEFAULT_TERMINATOR;
      const textEnc = String(item.text || '').replace(/\r\n/g, '\n').replace(/\n/g, '\\n');
      const grp = String(item.group || 'Genel');
      const lbl = String(item.label || '');
      const fullLabel = grp && grp !== 'Genel' ? `${grp}/${lbl}` : lbl;
      return `[list_text]\n${tid}=${keys}=${textEnc}${term}\n\n[list_order]\n${tid}=${index + 1}\n\n[list_label]\n${tid}=${fullLabel}`;
    }

    function downloadBytes(bytesOrStr, filename, mimeType) {
      const blob = new Blob([bytesOrStr], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function copyTextBrowser(text) {
      const value = String(text || '');
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch (_err) {
        }
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return Boolean(ok);
      } catch (_err2) {
        return false;
      }
    }

    function normalizeComboText(combo) {
      const parts = String(combo || '').split('+').map((p) => p.trim()).filter(Boolean);
      const mods = new Set();
      let trigger = '';
      for (const p of parts) {
        const low = p.toLowerCase();
        if (low === 'win' || low === 'l-win' || low === 'cmd' || low === 'super') mods.add('Win');
        else if (low === 'ctrl' || low === 'control') mods.add('Ctrl');
        else if (low === 'alt' || low === 'opt') mods.add('Alt');
        else if (low === 'shift') mods.add('Shift');
        else if (low === 'space' || low === 'spc') trigger = 'Space';
        else trigger = p.length === 1 ? p.toUpperCase() : p;
      }
      const ordered = CANONICAL_MODIFIERS.filter((m) => mods.has(m));
      return trigger ? [...ordered, trigger].join('+') : combo;
    }

    function detectHotkeyConflictsStatic(hkMap) {
      const conflicts = {};
      const byCombo = {};
      for (const [slot, raw] of Object.entries(hkMap)) {
        const clean = String(raw || '').trim();
        if (!clean) continue;
        const norm = normalizeComboText(clean);
        if (!byCombo[norm]) byCombo[norm] = [];
        byCombo[norm].push(slot);
        if (WIN_RESERVED[norm]) {
          if (!conflicts[slot]) conflicts[slot] = [];
          conflicts[slot].push(WIN_RESERVED[norm]);
        }
        if (TRQ_ALTGR[norm]) {
          if (!conflicts[slot]) conflicts[slot] = [];
          conflicts[slot].push(TRQ_ALTGR[norm]);
        }
      }
      for (const [norm, owners] of Object.entries(byCombo)) {
        if (owners.length > 1) {
          for (const slot of owners) {
            if (!conflicts[slot]) conflicts[slot] = [];
            conflicts[slot].push(`Çift atama: '${norm}' başka kategorilerde de kullanılıyor.`);
          }
        }
      }
      return conflicts;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderInlineMd(text) {
      let s = escapeHtml(text);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return s;
    }

    function renderMarkdownSafeHtml(mdText) {
      const lines = String(mdText || '').split(/\r?\n/);
      const out = [];
      let inCode = false;
      let inList = false;
      let inTable = false;
      let tableHeaderDone = false;
      const closeBlocks = () => {
        if (inList) { out.push('</ul>'); inList = false; }
        if (inTable) { out.push('</table>'); inTable = false; tableHeaderDone = false; }
      };
      for (const raw of lines) {
        const st = raw.trim();
        if (st.startsWith('```')) {
          closeBlocks();
          if (!inCode) { out.push('<pre><code>'); inCode = true; }
          else { out.push('</code></pre>'); inCode = false; }
          continue;
        }
        if (inCode) {
          out.push(escapeHtml(raw) + '\n');
          continue;
        }
        if (!st) {
          closeBlocks();
          continue;
        }
        if (st.startsWith('|') && st.endsWith('|')) {
          if (inList) { out.push('</ul>'); inList = false; }
          const cells = st.slice(1, -1).split('|').map((c) => c.trim());
          if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
          if (!inTable) { out.push('<table>'); inTable = true; tableHeaderDone = false; }
          const tag = tableHeaderDone ? 'td' : 'th';
          out.push('<tr>' + cells.map((c) => `<${tag}>${renderInlineMd(c)}</${tag}>`).join('') + '</tr>');
          tableHeaderDone = true;
          continue;
        } else if (inTable) {
          out.push('</table>');
          inTable = false;
          tableHeaderDone = false;
        }
        if (st.startsWith('### ')) { closeBlocks(); out.push(`<h3>${renderInlineMd(st.slice(4))}</h3>`); }
        else if (st.startsWith('## ')) { closeBlocks(); out.push(`<h2>${renderInlineMd(st.slice(3))}</h2>`); }
        else if (st.startsWith('# ')) { closeBlocks(); out.push(`<h1>${renderInlineMd(st.slice(2))}</h1>`); }
        else if (st.startsWith('> ')) { closeBlocks(); out.push(`<blockquote>${renderInlineMd(st.slice(2))}</blockquote>`); }
        else if (/^([-*]|\d+\.)\s+/.test(st)) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${renderInlineMd(st.replace(/^([-*]|\d+\.)\s+/, ''))}</li>`);
        } else if (st === '---') {
          closeBlocks();
          out.push('<hr/>');
        } else {
          closeBlocks();
          out.push(`<p>${renderInlineMd(st)}</p>`);
        }
      }
      closeBlocks();
      if (inCode) out.push('</code></pre>');
      return out.join('\n');
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, headers: {} };
      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const cleanPath = path.startsWith('/') ? '.' + path : path;
      const resp = await fetch(cleanPath, opts);
      return await resp.json();
    }

    async function detectBackendMode() {
      try {
        const resp = await fetch('./api/revision', { cache: 'no-store' });
        const ctype = (resp.headers.get('content-type') || '').toLowerCase();
        if (!resp.ok || !ctype.includes('application/json')) return null;
        const payload = await resp.json();
        if (payload && payload.ok === true && payload.data && typeof payload.data.revision === 'number') {
          return payload;
        }
        return null;
      } catch (_err) {
        return null;
      }
    }

        raw_key: String(raw.raw_key || `text_${String(idx).padStart(3, '0')}`),

        group: String(raw.group || 'Genel').trim() || 'Genel',
        label: String(raw.label || '').trim(),
        text: String(raw.text || ''),
        terminator: raw.terminator !== undefined ? String(raw.terminator) : DEFAULT_TERMINATOR,
      };
    }

      }

    function loadHotkeysLocal() {
      try {
        const raw = localStorage.getItem(LS_HOTKEYS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state.hotkeys = { ...HOTKEY_PRESETS.recommended, ...parsed };
          }
        }
      } catch (_err) {
      }

    async function loadStaticData(forceNetwork = false) {
      let loaded = null;
      if (!forceNetwork) {
        try {
          const cached = localStorage.getItem(LS_ITEMS_KEY);
          if (cached) {
            const arr = JSON.parse(cached);
            if (Array.isArray(arr) && arr.length) {
              loaded = arr.map((it, idx) => normalizeRawItem(it, idx));
            }
          }
        } catch (_err) {
        }
      }
      if (!loaded && (forceNetwork || navigator.onLine !== false)) {
        try {
          const res = await fetch('./data.json', { cache: 'no-store' });
          if (res.ok) {
            const arr = await res.json();
            if (Array.isArray(arr)) {
              loaded = arr.map((it, idx) => normalizeRawItem(it, idx));
            }
          }
        } catch (_err) {
        }
        if (!loaded) {
          try {
            const resIni = await fetch('./QuickTextPaste.ini', { cache: 'no-store' });
            if (resIni.ok) {
              const buf = new Uint8Array(await resIni.arrayBuffer());
              const decoded = decodeBytesAuto(buf);
              const parsed = parseQtpIni(decoded.text);
              loaded = parsed.items;
              state.program = parsed.program;
              state.extraSections = parsed.extraSections;
            }
          } catch (_err2) {
          }
        }
      }
      if (loaded) {
        state.allItems = loaded;
        saveItemsStaticLocal();
      }
      loadHotkeysLocal();
    }

            fetchTextSafe('./docs/KULLANIM.md', 'Kullanım belgesi okunamadı (./docs/KULLANIM.md).'),
            fetchTextSafe('./docs/KURULUM.md', 'Kurulum belgesi okunamadı (./docs/KURULUM.md).'),
            fetchTextSafe('./docs/KISAYOLLAR.md', 'Kısayol belgesi okunamadı (./docs/KISAYOLLAR.md).'),
            fetchTextSafe('./docs/SSS.md', 'SSS belgesi okunamadı (./docs/SSS.md).'),
          ]);
          state.helpData = {
            usage: CLI_HELP_STATIC_TEXT,
            usage_verbose: CLI_HELP_STATIC_TEXT,
            kullanim,
            kurulum,
            kisayollar,
            sss,
          };
        } else {
          const r = await api('/api/help?verbose=1');
          if (r.ok && r.data) {
            state.helpData = r.data;
          }
        }
      }
      els.helpTabs.style.display = 'flex';
      els.modalTitle.textContent = 'QTP Türkçe Yardım (F1)';
      renderHelpSection(sectionKey);
      els.modal.style.display = 'flex';
    }

    function openCrudModal(item = null) {
      const sourceItems = state.isStatic ? state.allItems : state.items;
      const groups = Array.from(new Set(sourceItems.map((it) => it.group || 'Genel').concat(['Genel']))).sort();
      els.crudGroupList.innerHTML = '';
      groups.forEach((g) => {
        const opt = document.createElement('option');
        opt.value = g;
        els.crudGroupList.appendChild(opt);
      });
      if (item) {
        state.crudEditRawKey = item.raw_key;
        els.crudTitle.textContent = `Cevabı Düzenle (${item.raw_key || ''})`;
        els.crudKeys.value = item.keys || '';
        els.crudGroup.value = item.group || 'Genel';
        els.crudLabel.value = item.label || '';
        els.crudText.value = item.text || '';
        els.crudEndMarker.checked = item.terminator === DEFAULT_TERMINATOR;
      } else {
        state.crudEditRawKey = null;
        els.crudTitle.textContent = 'Yeni Hazır Cevap Ekle';
        els.crudKeys.value = state.category !== 'ALL' ? `L-Win+${state.category}` : 'L-Win+A';
        els.crudGroup.value = 'Genel';
        els.crudLabel.value = '';
        els.crudText.value = '';
        els.crudEndMarker.checked = true;
      }
      els.crudModal.style.display = 'flex';
      els.crudText.focus();
    }

    async function saveCrudModal() {
      const textVal = String(els.crudText.value || '');
      if (!textVal.trim()) {
        showToast('Metin alanı boş olamaz.');
        return;
      }
      const payload = {
        keys: String(els.crudKeys.value || '').trim(),
        group: String(els.crudGroup.value || 'Genel').trim() || 'Genel',
        label: String(els.crudLabel.value || '').trim(),
        text: textVal,
        terminator: els.crudEndMarker.checked ? DEFAULT_TERMINATOR : '',
      };

      if (state.isStatic) {
        if (state.crudEditRawKey) {
          const idx = state.allItems.findIndex((it) => it.raw_key === state.crudEditRawKey);
          if (idx === -1) {
            showToast(`Öğe bulunamadı: ${state.crudEditRawKey}`);
            return;
          }
          state.allItems[idx] = { ...state.allItems[idx], ...payload };
          saveItemsStaticLocal();
          showToast('Kayıt güncellendi ✔');
        } else {
          state.allItems.push({ ...payload, raw_key: `text_${String(state.allItems.length).padStart(3, '0')}` });
          saveItemsStaticLocal();
          showToast('Yeni cevap eklendi ✔');
        }
        els.crudModal.style.display = 'none';
        updateStaticCategories();
        updateStaticItems();
        return;
      }

      const res = state.crudEditRawKey
        ? await api('/api/items/update', 'POST', { target: state.crudEditRawKey, ...payload })
        : await api('/api/items/add', 'POST', payload);
      if (res.ok) {
        els.crudModal.style.display = 'none';
        await loadCategories();
        await loadItems();
      }
      showToast(res.message || res.error || 'İşlem tamamlandı');
    }

    function openDeleteModal(item) {
      state.crudDeleteTarget = item;
      const preview = String(item.label || item.text || '').slice(0, 60);
      els.delConfirmMsg.textContent = `'${preview}' kaydını kalıcı olarak silmek istediğinize emin misiniz?`;
      els.delModal.style.display = 'flex';
    }

    async function confirmDeleteModal() {
      const item = state.crudDeleteTarget;
      if (!item) return;
      if (state.isStatic) {
        const before = state.allItems.length;
        state.allItems = state.allItems.filter((it) => it.raw_key !== item.raw_key);
        if (state.allItems.length === before) {
          showToast(`Öğe bulunamadı: ${item.raw_key}`);
          return;
        }
        saveItemsStaticLocal();
        els.delModal.style.display = 'none';
        state.crudDeleteTarget = null;
        updateStaticCategories();
        updateStaticItems();
        showToast('Kayıt silindi ✔');
        return;
      }
      const res = await api('/api/items/delete', 'POST', { target: item.raw_key || item.text });
      els.delModal.style.display = 'none';
      state.crudDeleteTarget = null;
      await loadCategories();
      await loadItems();
      showToast(res.message || res.error || 'Kayıt silindi ✔');
    }

    function renderPills() {
      els.pills.innerHTML = '';
      for (const cat of state.categories) {
        const b = document.createElement('button');
        b.className = 'pill' + (cat.code === state.category ? ' active' : '');
        b.textContent = `${cat.label} (${cat.count})`;
        b.onclick = () => { state.category = cat.code; renderPills(); loadItems(); };
        els.pills.appendChild(b);
      }
    }

    function renderHighlightedText(container, fullText, matchedIndices) {
      const clipped = fullText.length > 140 ? fullText.slice(0, 140) + '…' : fullText;
      const matchSet = new Set(Array.isArray(matchedIndices) ? matchedIndices : []);
      if (!matchSet.size) {
        container.textContent = clipped;
        return;
      }
      let buf = '';
      let inMark = false;
      const flush = () => {
        if (!buf) return;
        if (inMark) {
          const mk = document.createElement('mark');
          mk.className = 'hl';
          mk.textContent = buf;
          container.appendChild(mk);
        } else {
          container.appendChild(document.createTextNode(buf));
        }
        buf = '';
      };
      for (let i = 0; i < clipped.length; i++) {
        const isHit = i < 140 && matchSet.has(i);
        if (isHit !== inMark) {
          flush();
          inMark = isHit;
        }
        buf += clipped[i];
      }
      flush();
    }

    async function handleCopyItem(item) {
      if (state.isStatic) {
        const ok = await copyTextBrowser(item.text);
        showToast(ok ? 'Panoya kopyalandı ✔' : 'Pano erişimi engellendi; metni seçip kopyalayın.');
        return;
      }
      const r = await api('/api/copy', 'POST', { target: item.raw_key });
      showToast(r.message || r.error);
    }

    async function handlePasteItem(item) {
      if (state.isStatic) {
        const ok = await copyTextBrowser(item.text);
        showToast(ok ? 'Panoya kopyalandı ✔' : 'Pano erişimi engellendi.');
        return;
      }
      const r = await api('/api/paste', 'POST', { target: item.raw_key });
      showToast(r.message || r.error);
    }

    function renderList() {
      els.list.innerHTML = '';
      const visible = state.items.slice(0, 200);
      const totalAll = state.isStatic ? state.allItems.length : null;
      els.count.textContent = totalAll !== null ? `${state.items.length} / ${totalAll} kayıt` : `${state.items.length} kayıt`;
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'Eşleşen hazır cevap bulunamadı.';
        els.list.appendChild(empty);
        return;
      }
      visible.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'snippet-row' + (idx === state.selected ? ' selected' : '');
        const left = document.createElement('div');
        left.className = 'snippet-main';
        const txt = document.createElement('div');
        txt.className = 'snippet-text';
        renderHighlightedText(txt, String(it.text || '').replace(/\r?\n/g, ' '), it.matched_indices);
        const meta = document.createElement('div');
        meta.className = 'snippet-meta';
        meta.textContent = it.label ? `${it.group} · ${it.label}` : it.group;
        left.appendChild(txt);
        left.appendChild(meta);

        const right = document.createElement('div');
        right.className = 'row-actions';
        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn';
        editBtn.textContent = 'Düzenle';
        editBtn.onclick = (ev) => {
          ev.stopPropagation();
          openCrudModal(it);
        };
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn danger';
        delBtn.textContent = 'Sil';
        delBtn.onclick = (ev) => {
          ev.stopPropagation();
          openDeleteModal(it);
        };
        const iniBtn = document.createElement('button');
        iniBtn.className = 'action-btn';
        iniBtn.textContent = "INI'de Göster";
        iniBtn.onclick = (ev) => {
          ev.stopPropagation();
          showIniModal(it, idx);
        };
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.textContent = 'Kopyala';
        copyBtn.onclick = async (ev) => {
          ev.stopPropagation();
          await handleCopyItem(it);
        };
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = hotkeyBadge(it.keys || '') || '•';
        right.appendChild(editBtn);
        right.appendChild(delBtn);
        right.appendChild(iniBtn);
        right.appendChild(copyBtn);
        right.appendChild(badge);

        row.appendChild(left);
        row.appendChild(right);
        row.oncontextmenu = (ev) => {
          ev.preventDefault();
          showIniModal(it, idx);
        };
        row.onclick = async () => {
          state.selected = idx;
          renderList();
          await handlePasteItem(it);
        };
        els.list.appendChild(row);
      });
      const selEl = els.list.children[state.selected];
      if (selEl && typeof selEl.scrollIntoView === 'function') {
        selEl.scrollIntoView({ block: 'nearest' });
      }
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      loadItems();
    });

    els.modal.addEventListener('click', (ev) => {
      if (ev.target === els.modal) els.modal.style.display = 'none';
    });
    els.crudModal.addEventListener('click', (ev) => {
      if (ev.target === els.crudModal) els.crudModal.style.display = 'none';
    });
    els.delModal.addEventListener('click', (ev) => {
      if (ev.target === els.delModal) els.delModal.style.display = 'none';
    });

    document.addEventListener('keydown', async (e) => {
      const crudOpen = els.crudModal.style.display === 'flex';
      const delOpen = els.delModal.style.display === 'flex';
      const modalOpen = els.modal.style.display === 'flex';
      if (e.key === 'F1') {
        e.preventDefault();
        await showHelpModal('genel');
        return;
      }
      if (e.key === 'Escape') {
        if (crudOpen) els.crudModal.style.display = 'none';
        else if (delOpen) els.delModal.style.display = 'none';
        else if (modalOpen) els.modal.style.display = 'none';
        else {
          els.search.value = '';
          state.query = '';
          loadItems();
        }
        return;
      }
      if (crudOpen || delOpen) return;
      if (modalOpen) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          els.modalBody.scrollTop += 48;
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          els.modalBody.scrollTop = Math.max(0, els.modalBody.scrollTop - 48);
        } else if (e.key === 'PageDown') {
          e.preventDefault();
          els.modalBody.scrollTop += 260;
        } else if (e.key === 'PageUp') {
          e.preventDefault();
          els.modalBody.scrollTop = Math.max(0, els.modalBody.scrollTop - 260);
        }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        els.search.focus();
      } else if (e.key === '/') {
        if (document.activeElement !== els.search) {
          e.preventDefault();
          els.search.focus();
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        const maxVis = Math.min(state.items.length, 200) - 1;
        state.selected = Math.min(Math.max(0, maxVis), state.selected + 1);
        renderList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.selected = Math.max(0, state.selected - 1);
        renderList();
      } else if (e.key === 'PageDown') {
        e.preventDefault();
        const maxVis = Math.min(state.items.length, 200) - 1;
        state.selected = Math.min(Math.max(0, maxVis), state.selected + 6);
        renderList();
      } else if (e.key === 'PageUp') {
        e.preventDefault();
        state.selected = Math.max(0, state.selected - 6);
        renderList();
      } else if (e.key === 'Enter' && state.items[state.selected]) {
        e.preventDefault();
        const it = state.items[state.selected];
        if (e.ctrlKey || e.metaKey) {
          await handleCopyItem(it);
        } else {
          await handlePasteItem(it);
        }
      }
    });

    document.getElementById('modalClose').onclick = () => { els.modal.style.display = 'none'; };
    document.getElementById('btnHelp').onclick = () => showHelpModal('genel');
    document.getElementById('btnAddNew').onclick = () => openCrudModal(null);
    document.getElementById('crudClose').onclick = () => { els.crudModal.style.display = 'none'; };
    document.getElementById('crudCancel').onclick = () => { els.crudModal.style.display = 'none'; };
    document.getElementById('crudSave').onclick = saveCrudModal;
    document.getElementById('delCancelTop').onclick = () => { els.delModal.style.display = 'none'; };
    document.getElementById('delCancelBtn').onclick = () => { els.delModal.style.display = 'none'; };
    document.getElementById('delConfirmBtn').onclick = confirmDeleteModal;

    els.btnThemeToggle.onclick = async () => {
      const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
      applyThemeDom(nextTheme);
      if (state.isStatic) {
        try { localStorage.setItem(LS_THEME_KEY, nextTheme); } catch (_err) {}
        showToast(nextTheme === 'dark' ? 'Koyu tema etkinleştirildi.' : 'Açık tema etkinleştirildi.');
        return;
      }
      const r = await api('/api/settings', 'POST', { key: 'theme', value: nextTheme });
      showToast(r.message || r.error || 'Tema güncellendi');
    };

    for (const btn of els.helpTabs.querySelectorAll('[data-section]')) {
      btn.onclick = () => renderHelpSection(btn.dataset.section);
    }
    document.getElementById('btnHotkeys').onclick = showHotkeysModal;
    document.getElementById('btnApplyPreset').onclick = async () => {
      const preset = document.getElementById('presetSelect').value;
      if (state.isStatic) {
        if (HOTKEY_PRESETS[preset]) {
          state.hotkeys = { ...HOTKEY_PRESETS[preset] };
          saveHotkeysLocal();
          showToast(`Kısayol profili uygulandı ✔ (${preset})`);
          showHotkeysModal();
        }
        return;
      }
      const r = await api('/api/hotkeys/preset', 'POST', { preset });
      showToast(r.message || r.error);
      showHotkeysModal();
    };
    document.getElementById('btnApplyMods').onclick = async () => {
      const modifiers = document.getElementById('modSelect').value;
      if (state.isStatic) {
        const updated = {};
        for (const [slot, val] of Object.entries(state.hotkeys)) {
          const tail = String(val || '').split('+').pop().trim() || (slot === 'all' ? 'Space' : slot.toUpperCase());
          updated[slot] = normalizeComboText(`${modifiers}+${tail}`);
        }
        state.hotkeys = updated;
        saveHotkeysLocal();
        showToast('Değiştirici bileşimi tüm kısayollara uygulandı ✔');
        showHotkeysModal();
        return;
      }
      const r = await api('/api/hotkeys/modifiers', 'POST', { modifiers });
      showToast(r.message || r.error);
      showHotkeysModal();
    };
    els.btnDownloadSettings.onclick = () => {
      const payload = {
        theme: state.theme,
        hotkeys: state.hotkeys,
        last_category: state.category,
        window_size: [720, 520],
        paste_method: 'auto',
        enter_after_paste: true,
        auto_reload: true,
        auto_reload_interval_ms: 500,
        language: 'tr',
      };
      downloadBytes(JSON.stringify(payload, null, 2) + '\n', 'qtp_settings.json', 'application/json;charset=utf-8');
      showToast('qtp_settings.json indirildi ✔');
    };
    document.getElementById('btnReload').onclick = async () => {
      if (state.isStatic) {
        await loadStaticData(true);
        await loadCategories();
        await loadItems();
        showToast(`Veriler yenilendi (${state.allItems.length} kayıt) ✔`);
        return;
      }
      const r = await api('/api/reload', 'POST', {});
      showToast(r.message || r.error);
      await loadCategories();
      await loadItems();
    };
    document.getElementById('btnBackup').onclick = async () => {
      if (state.isStatic) {
        showStaticBackupModal();
        return;
      }
      const r = await api('/api/backup', 'POST', {});
      showToast(r.message || r.error);
    };
    document.getElementById('btnDownloadBackupJson').onclick = () => {
      const stamp = new Date().toISOString().slice(0, 10);
      const cleanItems = state.allItems.map((it) => {
        const obj = { keys: it.keys, group: it.group };
        if (it.label) obj.label = it.label;
        obj.text = it.text;
        return obj;
      });
      const payload = {
        type: 'qtp-pwa-backup',
        version: 2,
        exportedAt: new Date().toISOString(),
        settings: { theme: state.theme, hotkeys: state.hotkeys },
        program: state.program || {},
        extraSections: state.extraSections || [],
        items: cleanItems,
      };
      downloadBytes(JSON.stringify(payload, null, 2) + '\n', `qtp-tam-yedek-${stamp}.json`, 'application/json;charset=utf-8');
      showToast(`Tam yedek indirildi: ${cleanItems.length} kayıt ✔`);
    };
    document.getElementById('btnDownloadIniUtf16').onclick = () => {
      const iniTxt = buildQtpIni(state.allItems, state.program, state.extraSections);
      const bytes = encodeUtf16LeBom(iniTxt);
      downloadBytes(bytes, 'QuickTextPaste.ini', 'text/plain;charset=utf-16le');
      showToast(`QuickTextPaste.ini indirildi: ${state.allItems.length} kayıt ✔`);
    };

    if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        state.deferredPrompt = e;
        if (els.btnInstallPwa) els.btnInstallPwa.style.display = 'inline-flex';
      });
      if (els.btnInstallPwa) {
        els.btnInstallPwa.onclick = async () => {
          if (!state.deferredPrompt) {
            showToast("Tarayıcı menüsünden 'Uygulamayı yükle / Ana Ekrana Ekle' seçin.");
            return;
          }
          state.deferredPrompt.prompt();
          await state.deferredPrompt.userChoice;
          state.deferredPrompt = null;
          els.btnInstallPwa.style.display = 'none';
        };
      }
    }

    function startLivePolling() {
      if (state.isStatic || state.pollTimer) return;
      state.pollTimer = setInterval(async () => {
        try {
          const r = await api('/api/revision');
          if (r.ok && r.data.revision !== state.revision) {
            const prevRev = state.revision;
            state.revision = r.data.revision;
            if (r.data.theme) applyThemeDom(r.data.theme === 'dark' ? 'dark' : 'light');
            if (prevRev !== 0) {
              await loadCategories();
              await loadItems();
              showToast('Değişiklikler otomatik yenilendi ✔');
            }
          }
        } catch (_err) {
        }
      }, 1000);
    }

    async function initWebUi() {
      setupOsDownloadButton();
      const revPayload = await detectBackendMode();
      if (revPayload) {
        state.isStatic = false;
        state.revision = revPayload.data.revision || 0;
        const srvTheme = revPayload.data.theme === 'dark' ? 'dark' : 'light';
        applyThemeDom(srvTheme);
        if (revPayload.data.initial_category) {
          state.category = String(revPayload.data.initial_category).toUpperCase();
        }
        if (revPayload.data.initial_query) {
          state.query = String(revPayload.data.initial_query);
          els.search.value = state.query;
        }
        els.modeBadge.textContent = 'Canlı Mod (--web)';
        startLivePolling();
      } else {
        state.isStatic = true;
        els.modeBadge.textContent = 'Statik Web (Çevrimdışı / GitHub Pages)';
        let savedTheme = 'light';
        try {
          const lsTheme = localStorage.getItem(LS_THEME_KEY);
          if (lsTheme === 'dark' || lsTheme === 'light') savedTheme = lsTheme;
        } catch (_err) {
        }
        applyThemeDom(savedTheme);
        const params = new URLSearchParams(location.search || '');
        const pCat = params.get('category');
        const pQuery = params.get('query') || params.get('q');
        if (pCat) state.category = String(pCat).toUpperCase();
        if (pQuery) {
          state.query = String(pQuery);
          els.search.value = state.query;
        }
        await loadStaticData(false);
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      }
      await loadCategories();
      await loadItems();
    }

    initWebUi();
  </script>
</body>
